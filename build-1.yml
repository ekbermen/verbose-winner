name: Build Novax APK

# Novax v5 - proje sıkıştırılmış arşiv olarak bu dosyada gömülü (GitHub 512 KB sınırı için).
# Kullanım: bunu repoda .github/workflows/build.yml olarak kaydet, Actions > Run workflow.
# Opsiyonel secret: GEMINI_API_KEY (boşsa API anahtarını uygulama içinden girersin; şirketi otomatik algılar).
#
# v2 özellikleri:
#  - Canlı kamera (görüntülü sohbet), '@Arkaplan' ile arka plan görevleri, telefon PIN + çağrı devri
#  - Her API anahtarı için önce şirket testi/algılama, sonra model seçimi (Gemini, OpenAI, Claude, Groq, OpenRouter, xAI, DeepSeek, Mistral ...)
#  - WhatsApp sesli mesaj, sesli mesaj/foto/video analizi, Play Store'dan oyun indirme, klavye ile yazma
#  - Hızlı ekran kontrolü (toplu eylem), düzeltilmiş ekran görüntüsü, bildirim okuma/yanıtlama, zamanlanmış görevler

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: SDK paketleri (runner'daki hazır SDK)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms" || true


